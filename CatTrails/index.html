<link rel="stylesheet" href="style.css">
<script src="scripts.js" defer></script>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisker Trail</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game">
    <h1>🐾 Whisker Trail 🏔️</h1>

    <div class="subtitle">
      Guide magical cats across enchanted lands to reach Bundt Cake Mountain.
    </div>

    <div class="pixel-scene">
      <div class="mountain"></div>
      <div class="icing"></div>
      <div class="cat" id="catSprite"></div>
    </div>

    <div class="panel stats">
      <div class="stat">🐱 Cats: <span id="cats">4</span></div>
      <div class="stat">🍗 Fish Snacks: <span id="food">80</span></div>
      <div class="stat">✨ Magic: <span id="magic">50</span></div>
      <div class="stat">💖 Morale: <span id="morale">100</span></div>
      <div class="stat">📍 Distance: <span id="distance">0</span>/1000</div>
      <div class="stat">🪙 Moon Coins: <span id="coins">25</span></div>
    </div>

    <div class="panel">
      <h2>Journey Progress</h2>
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Current Event</h2>
      <div id="eventText">
        Your feline caravan begins its magical journey...
      </div>
      <div class="choices" id="choices"></div>
    </div>

    <div class="panel">
      <h2>Travel Actions</h2>
      <button onclick="travel()">🐾 Continue Traveling</button>
      <button onclick="rest()">🛏️ Rest</button>
      <button onclick="forage()">🍄 Forage</button>
      <button onclick="castSpell()">✨ Cast Spell</button>
      <button onclick="visitMerchant()">🧙 Visit Merchant</button>
    </div>

    <div class="panel">
      <h2>Adventure Log</h2>
      <div id="log"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
